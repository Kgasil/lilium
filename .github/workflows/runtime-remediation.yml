name: Lilium isolated runtime remediation
on:
  push:
    branches: [development/lilium-cycle03-runtime-remediation]
    paths:
      - 'validation/candidate-authorization.json'
permissions:
  contents: read
concurrency:
  group: lilium-controlled-handoff
  cancel-in-progress: false
jobs:
  windows-preview:
    permissions:
      contents: write
    runs-on: windows-2022
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: Require exact source owner authorization before build
        shell: pwsh
        run: |
          python validation/candidate_build_gate.py
          if (-not (Test-Path -LiteralPath 'validation/microsoft-reviewed-files.json' -PathType Leaf)) { throw 'Reviewed exact Microsoft source rights missing' }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify official signed ClamAV definitions before compiling
        id: preflight
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $evidence = Join-Path $PWD 'runtime-evidence'
          New-Item -ItemType Directory -Path $evidence -Force | Out-Null
          $report = [ordered]@{commit=$env:GITHUB_SHA; utc=[DateTimeOffset]::UtcNow.ToString('o'); status='INCONCLUSIVE'; release_approved=$false}
          try {
          $tmp = Join-Path $env:RUNNER_TEMP ('lilium-preflight-' + [guid]::NewGuid().ToString('N'))
          New-Item -ItemType Directory -Path $tmp | Out-Null
          $zip = Join-Path $tmp 'clamav.zip'
          Invoke-WebRequest -Uri 'https://github.com/Cisco-Talos/clamav/releases/download/clamav-1.5.5/clamav-1.5.5.win.x64.zip' -OutFile $zip -TimeoutSec 300
          if ((Get-Item -LiteralPath $zip).Length -ne 225800047 -or (Get-FileHash -LiteralPath $zip -Algorithm SHA256).Hash.ToLowerInvariant() -cne '90169f5e551010bfbd0208b50d9b2fa8988ef396cccbd46b0cc8cae03e22a4a4') { throw 'Scanner archive mismatch' }
          Expand-Archive -LiteralPath $zip -DestinationPath (Join-Path $tmp 'engine')
          $fresh = @(Get-ChildItem -LiteralPath (Join-Path $tmp 'engine') -Recurse -File -Filter freshclam.exe)
          if ($fresh.Count -ne 1) { throw 'Expected exactly one FreshClam' }
          $db = Join-Path $tmp 'database'
          New-Item -ItemType Directory -Path $db | Out-Null
          $conf = Join-Path $tmp 'freshclam.conf'
          @(('DatabaseDirectory "'+$db+'"'),'DatabaseMirror database.clamav.net','Checks 1') | Set-Content -LiteralPath $conf -Encoding ascii
          & $fresh[0].FullName "--config-file=$conf" --stdout 2>&1 | Tee-Object -FilePath (Join-Path $evidence 'preflight-freshclam.log')
          if ($LASTEXITCODE -ne 0) { throw 'Official update failed; no build' }
          $daily = @(Get-ChildItem -LiteralPath $db -File | Where-Object { $_.Name -in @('daily.cvd','daily.cld') })
          if ($daily.Count -ne 1) { throw 'Daily definitions missing or ambiguous' }
          $sig = Join-Path $fresh[0].DirectoryName 'sigtool.exe'
          $info = (& $sig --info $daily[0].FullName | Out-String)
          if ($LASTEXITCODE -ne 0 -or $info -notmatch '(?m)^Verification OK\.?\s*$') { throw 'Signed database verification failed' }
          $info | Set-Content -LiteralPath (Join-Path $evidence 'preflight-daily-info.txt') -Encoding utf8
          $m = [regex]::Match($info,'(?m)^Build time:\s*(.+)$')
          if (-not $m.Success) { throw 'Missing signature timestamp' }
          Write-Host $info
          $raw = $m.Groups[1].Value.Trim() -replace '([+-]\d{2})(\d{2})$','$1:$2'
          $date = [DateTimeOffset]::ParseExact($raw,'dd MMM yyyy HH:mm zzz',[Globalization.CultureInfo]::InvariantCulture)
          $age = ([DateTimeOffset]::UtcNow-$date).TotalSeconds
          $report['definition_build_utc']=$date.ToUniversalTime().ToString('o')
          $report['definition_age_seconds']=[math]::Round($age)
          if ($age -lt 0 -or $age -gt 86400) { $report.status='STALE_DEFINITIONS'; throw 'Official definitions stale; no compilation or release' }
          $report.status='FRESH_DEFINITIONS'
          "LILIUM_CLAM_ENGINE=$($fresh[0].DirectoryName)" >> $env:GITHUB_ENV
          "LILIUM_CLAM_DB=$db" >> $env:GITHUB_ENV
          Write-Host 'Signed daily definitions fresh; normal build and complete scans still required.'
          } catch {
            $report['error']=$_.Exception.Message
            throw
          } finally {
            $report | ConvertTo-Json -Depth 5 | Set-Content -LiteralPath (Join-Path $evidence 'preflight.json') -Encoding utf8
          }
      - name: Install exact upstream CPython after SHA-256 verification
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $installer = Join-Path $env:RUNNER_TEMP 'python-3.14.10-amd64.exe'
          $target = Join-Path $env:RUNNER_TEMP 'lilium-cpython-31410'
          Invoke-WebRequest -Uri 'https://www.python.org/ftp/python/3.14.10/python-3.14.10-amd64.exe' -OutFile $installer
          $hash = (Get-FileHash -LiteralPath $installer -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($hash -ne '92480239264744fe0386a1bd8275786fefa126e3129e56a68e22b52c73329965') { throw 'Official installer SHA-256 mismatch' }
          $signature = Get-AuthenticodeSignature -LiteralPath $installer
          if ($signature.Status -ne 'Valid') { throw 'Official installer signature not valid' }
          $proc = Start-Process -FilePath $installer -ArgumentList @('/quiet','InstallAllUsers=0',"TargetDir=`"$target`"",'Include_pip=1','Include_launcher=0','PrependPath=0','Include_test=0','Shortcuts=0') -Wait -PassThru
          if ($proc.ExitCode -ne 0) { throw "CPython installer failed: $($proc.ExitCode)" }
          if (-not (Test-Path (Join-Path $target 'python.exe'))) { throw 'Expected isolated interpreter missing' }
          New-Item -ItemType Directory -Force runtime-evidence | Out-Null
          @{installer_sha256=$hash;authenticode="$($signature.Status)";signer=$signature.SignerCertificate.Subject} | ConvertTo-Json | Set-Content -Encoding utf8 runtime-evidence/installer.json
          $target >> $env:GITHUB_PATH
          (Join-Path $target 'Scripts') >> $env:GITHUB_PATH
          "LILIUM_EXPECTED_PYTHON=$target\python.exe" >> $env:GITHUB_ENV
      - name: Confirm isolated interpreter selection
        shell: pwsh
        run: |
          if ((Get-Command python.exe).Source -ne $env:LILIUM_EXPECTED_PYTHON) { throw 'Wrong interpreter selected' }
          python -c "import sys,ssl,sqlite3; print(sys.executable,sys.version,ssl.OPENSSL_VERSION,sqlite3.sqlite_version)"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify exact runtime before dependency installation
        run: python -m desktop.runtime_evidence runtime-evidence/source.json
      - name: Install build dependencies
        shell: pwsh
        run: |
          python -m pip install pip==26.3
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pip install -r requirements-build.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pip check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Audit actual build environment before packaging
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path audit-evidence
          python -m pip freeze --all | Set-Content -Encoding utf8 audit-evidence/resolved.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m venv .venv-audit
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & .venv-audit/Scripts/python.exe -m pip install pip==26.3 pip-audit==2.10.1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & .venv-audit/Scripts/python.exe -m pip_audit --no-deps --disable-pip -r audit-evidence/resolved.txt --format json --output audit-evidence/build.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $audit = Get-Content audit-evidence/build.json -Raw | ConvertFrom-Json
          if (-not $audit.dependencies -or @($audit.dependencies | Where-Object { $_.skip_reason }).Count -ne 0) { throw "Incomplete dependency audit" }
      - name: Preserve build dependency evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Lilium-build-dependency-evidence
          path: audit-evidence/
          if-no-files-found: warn
          retention-days: 14
      - name: Python regression
        run: python -m unittest discover -s tests -v
      - name: JavaScript regression
        shell: pwsh
        run: |
          Get-ChildItem tests/*.test.js | ForEach-Object {
            node $_.FullName
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
      - name: Live source smoke test
        run: python tests/smoke_desktop.py
      - name: Live source lifecycle and recovery
        run: python tests/smoke_lifecycle.py
      - name: Build portable preview and run executable self-test
        run: python -m desktop.build_windows
      - name: Verify actual bundled DLL hashes against approved build runtime
        run: python -m desktop.runtime_evidence runtime-evidence/bundle.json --bundle dist/Lilium
      - name: Record Microsoft runtime DLL provenance (not entitlement)
        shell: pwsh
        run: |
          $root = Split-Path -Parent $env:LILIUM_EXPECTED_PYTHON
          ./desktop/microsoft_inventory.ps1 -Bundle dist/Lilium -PythonRoot $root -Output runtime-evidence/microsoft-inventory.json
      - name: Bundled readiness diagnostics
        shell: pwsh
        run: |
          $env:LOCALAPPDATA = Join-Path $env:RUNNER_TEMP "lilium-diagnostics"
          & dist/Lilium/Lilium.exe --diagnostics
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Live bundled smoke test
        run: python tests/smoke_desktop.py dist/Lilium/Lilium.exe
      - name: Live bundled lifecycle and recovery
        run: python tests/smoke_lifecycle.py dist/Lilium/Lilium.exe
      - name: Install browser test dependency
        run: python -m pip install playwright==1.56.0
      - name: Install Chromium
        run: python -m playwright install chromium
      - name: Browser pilot smoke test against source
        run: python tests/browser_pilot.py
      - name: Browser pilot smoke test against bundled application
        run: python tests/browser_pilot.py dist/Lilium/Lilium.exe
      - name: Collect third-party notices before packaging
        run: python -m desktop.license_evidence collect dist/Lilium runtime-evidence/license-index.json
      - name: Package versioned preview and verify staged copy
        shell: pwsh
        run: |
          python -m desktop.release_manager package --source dist/Lilium --output release-preview --commit "$env:GITHUB_SHA"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $manifest = Get-Content release-preview/manifest.json -Raw | ConvertFrom-Json
          $archive = Join-Path release-preview $manifest.filename
          python -m desktop.license_evidence verify $archive runtime-evidence/license-index.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m desktop.release_manager verify --archive $archive --manifest release-preview/manifest.json --sha256 $manifest.sha256
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $parent = Join-Path $env:RUNNER_TEMP ("lilium-staged-" + [guid]::NewGuid())
          New-Item -ItemType Directory -Path $parent | Out-Null
          $staged = python -m desktop.release_manager stage --archive $archive --manifest release-preview/manifest.json --sha256 $manifest.sha256 --parent $parent
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $folder = ($staged | ConvertFrom-Json).staged_folder
          python tests/smoke_desktop.py (Join-Path $folder "Lilium.exe")
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "### Lilium preview integrity" >> $env:GITHUB_STEP_SUMMARY
          "- Commit: $($manifest.commit)" >> $env:GITHUB_STEP_SUMMARY
          "- Archive: $($manifest.filename)" >> $env:GITHUB_STEP_SUMMARY
          "- SHA-256: $($manifest.sha256)" >> $env:GITHUB_STEP_SUMMARY
      - name: Check exact reviewed Microsoft runtime and candidate inventory
        shell: pwsh
        run: |
          python -m desktop.final_candidate rights runtime-evidence/microsoft-inventory.json validation/microsoft-reviewed-files.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $m=Get-Content release-preview/manifest.json -Raw | ConvertFrom-Json
          $archive=Join-Path release-preview $m.filename
          python -m desktop.final_candidate snapshot dist/Lilium $archive release-preview/manifest.json $env:GITHUB_SHA runtime-evidence/before-scan.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Copy-Item release-preview/manifest.json runtime-evidence/manifest.json
          Copy-Item release-preview/SHA256SUMS.txt runtime-evidence/SHA256SUMS.txt
      - name: Scan exact archive, executable and full bundle
        shell: pwsh
        run: |
          $m=Get-Content release-preview/manifest.json -Raw | ConvertFrom-Json
          ./desktop/scan_candidate.ps1 -Bundle dist/Lilium -Archive (Join-Path release-preview $m.filename) -Evidence runtime-evidence
      - name: Preserve exact verified candidate in unpublished draft only
        if: success()
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference='Stop'
          $m=Get-Content release-preview/manifest.json -Raw | ConvertFrom-Json
          $archive=Join-Path release-preview $m.filename
          python -m desktop.final_candidate snapshot dist/Lilium $archive release-preview/manifest.json $env:GITHUB_SHA runtime-evidence/after-scan.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ((Get-FileHash runtime-evidence/before-scan.json).Hash -cne (Get-FileHash runtime-evidence/after-scan.json).Hash) { throw 'Candidate inventory changed' }
          $scan=Get-Content runtime-evidence/candidate-scans.json -Raw | ConvertFrom-Json
          if ($scan.status -ne 'COMPLETE_NO_THREATS_REPORTED' -or $scan.release_approved -ne $false -or $scan.commit -cne $env:GITHUB_SHA -or $scan.archive_sha256 -cne $m.sha256 -or $scan.defender.Count -ne 3 -or $scan.clamav.Count -ne 3) { throw 'Incomplete scan evidence' }
          $tag='lilium-controlled-'+$env:GITHUB_RUN_ID
          gh release create $tag --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --title 'Lilium controlled candidate — DO NOT PUBLISH' --notes 'Unpublished candidate for exact native acceptance. No release authorization.' --draft --prerelease
          if ($LASTEXITCODE -ne 0) { throw 'Draft creation failed' }
          $draft=gh release view $tag --repo $env:GITHUB_REPOSITORY --json isDraft | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0 -or $draft.isDraft -ne $true) { throw 'Unpublished draft not verified' }
          gh release upload $tag $archive runtime-evidence/manifest.json runtime-evidence/SHA256SUMS.txt runtime-evidence/before-scan.json runtime-evidence/after-scan.json runtime-evidence/candidate-scans.json runtime-evidence/license-index.json runtime-evidence/microsoft-inventory.json --repo $env:GITHUB_REPOSITORY
          if ($LASTEXITCODE -ne 0) { throw 'Draft asset retention failed' }
          $draft=gh release view $tag --repo $env:GITHUB_REPOSITORY --json isDraft,assets | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0 -or $draft.isDraft -ne $true -or @($draft.assets|Where-Object {$_.name -ceq $m.filename -and $_.size -eq $m.bytes}).Count -ne 1) { throw 'Draft retention verification failed' }
          $download=Join-Path $env:RUNNER_TEMP ('lilium-draft-check-'+[guid]::NewGuid())
          New-Item -ItemType Directory -Path $download | Out-Null
          try {
            gh release download $tag --repo $env:GITHUB_REPOSITORY --pattern $m.filename --dir $download
            if ($LASTEXITCODE -ne 0) { throw 'Draft asset download failed; retention unverified' }
            $received=Join-Path $download $m.filename
            python -m desktop.release_manager verify --archive $received --manifest release-preview/manifest.json --sha256 $m.sha256
            if ($LASTEXITCODE -ne 0) { throw 'Retained bytes differ from scanned candidate' }
            $draft=gh release view $tag --repo $env:GITHUB_REPOSITORY --json isDraft | ConvertFrom-Json
            if ($LASTEXITCODE -ne 0 -or $draft.isDraft -ne $true) { throw 'Draft state changed; manual review required' }
            [ordered]@{commit=$env:GITHUB_SHA;tag=$tag;sha256=$m.sha256;bytes=$m.bytes;download_integrity='PASS';is_draft=$true;release_approved=$false} | ConvertTo-Json | Set-Content runtime-evidence/retention-verification.json
            'Controlled draft retained and re-downloaded SHA-256 verified; no public release.' >> $env:GITHUB_STEP_SUMMARY
          } finally { Remove-Item -LiteralPath $download -Recurse -Force }
      - name: Upload diagnostic evidence only (never binaries)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Lilium-runtime-remediation-evidence
          path: runtime-evidence/
          if-no-files-found: warn
          retention-days: 14
