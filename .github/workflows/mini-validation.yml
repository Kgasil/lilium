name: Lilium Mini validation
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'extension/**'
      - 'tests/browser_mini.py'
      - 'tests/verify_mini_original.py'
      - '.github/workflows/mini-validation.yml'
  pull_request:
    branches: [main]
    paths:
      - 'extension/**'
      - 'tests/browser_mini.py'
      - 'tests/verify_mini_original.py'
      - '.github/workflows/mini-validation.yml'
permissions:
  contents: read
jobs:
  mini:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Checkout original distributed Mini separately
        uses: actions/checkout@v4
        with:
          ref: 447d7414f20e28f6c0440647f2b7be71fc44e71d
          path: original-mini
          persist-credentials: false
      - name: Verify pinned Mini runtime and temporary build
        run: python tests/verify_mini_original.py original-mini/extension
      - name: Verify JavaScript syntax
        run: node --check extension/math.js && node --check extension/popup.js
      - name: Calculation regression
        run: node extension/math.test.js
      - name: Install browser test dependencies
        run: |
          python -m pip install playwright==1.56.0
          # Ubuntu hosted runner supplies system libraries; browser launch remains mandatory.
          python -m playwright install chromium
      - name: Popup UI regression (local page, not installed extension)
        run: python tests/browser_mini.py
      - name: Build and verify experimental extension package
        run: |
          python extension/package_mini.py --output mini-preview
          python extension/package_mini.py --output mini-rebuild
          diff -r mini-preview mini-rebuild
      - name: Upload experimental Mini ZIP and SHA-256
        uses: actions/upload-artifact@v4
        with:
          name: Lilium-Mini-experimental
          path: mini-preview/
          if-no-files-found: error
          retention-days: 14
